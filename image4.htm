<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="pragma" content="no-cache" />

  <title>Petit-Sault Brouetique</title>

  <style>
    @font-face {
      font-family: attic;
      src: url('fonts/attic.ttf');
    }

    html, body {
      padding: 0;
      margin: 0;
      height: 100%;
      font-family: attic, sans-serif;
      background-color: black;
    }

    .carousel {
      position: relative;
      max-width: 100%;
      overflow: hidden;
      height: 100vh;
    }

    .carousel-inner {
      height: 100%;
    }

    .item {
      display: none;
      width: 100%;
      height: 100%;
    }

    .item.active {
      display: block;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .carousel-control-prev,
    .carousel-control-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    .carousel-control-prev {
      left: 10px;
    }

    .carousel-control-next {
      right: 10px;
    }
  </style>
</head>
<body>

  <div id="myCarousel" class="carousel" aria-label="Carousel d’images">
    <div class="carousel-inner" id="carousel-inner">
      <div class="item active">
        <img src="vin.jpg">
      </div>
      <div class="item">
        <img src="spiritueux.jpg">
      </div>
    </div>

    <button class="carousel-control-prev" onclick="prevSlide()" aria-label="Image précédente">‹</button>
    <button class="carousel-control-next" onclick="nextSlide()" aria-label="Image suivante">›</button>
  </div>

  <script>
    let currentIndex = 0;
    const items = document.querySelectorAll('.item');
    const totalItems = items.length;

    function updateSlides(index) {
      items.forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % totalItems;
      updateSlides(currentIndex);
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + totalItems) % totalItems;
      updateSlides(currentIndex);
    }

    // Initial setup
    updateSlides(currentIndex);

    // Auto-slide every 20 seconds
    setInterval(nextSlide, 20000);
  </script>

</body>
</html>
