<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petit-Sault Brouetique</title>

  <style>
    @font-face {
      font-family: attic;
      src: url('fonts/attic.ttf');
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: attic, sans-serif;
      background: black;
    }

    .carousel {
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .item {
      display: none;
      width: 100%;
      height: 100%;
    }

    .item.active {
      display: block;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .carousel-control {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      padding: 0.5rem 1rem;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      cursor: pointer;
    }

    .carousel-control.prev { left: 10px; }
    .carousel-control.next { right: 10px; }
  </style>
</head>
<body>

      <div class="carousel">
      <div class="item active"><img src="pinte.jpg"> </div>
      <div class="item"> <img src="pichet.jpg"> </div>
      <div class="item"> <img src="juinMS.jpg"> </div> 
      <div class="item"> <img src="horaire_fr.jpg"> </div>
      <div class="item"> <img src="horaire_en.jpg"> </div>
      <div class="item"> <img src="garrett.jpg"> </div>
        <div class="item"> <img src="arkan.jpg"> </div>
      
    <button class="carousel-control prev" onclick="prevSlide()">‹</button>
    <button class="carousel-control next" onclick="nextSlide()">›</button>

    </div>

  <script>
    let currentIndex = 0;
    const items = document.querySelectorAll('.item');

    function showSlide(index) {
      items.forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % items.length;
      showSlide(currentIndex);
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + items.length) % items.length;
      showSlide(currentIndex);
    }

    setInterval(nextSlide, 20000);
  </script>

</body>
</html>
